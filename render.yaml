services:
  - type: web
    name: ai-commercial-court-research
    runtime: python
    buildCommand: "pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
